# Charge le fichier .env s'il existe (lignes CLE=valeur)
spring.config.import=optional:file:./.env[.properties]

spring.application.name=badges-blockchain
server.port=${PORT:3000}

# --- Base de donnees : PostgreSQL par defaut. Pour MySQL, changer seulement DB_URL :
#     jdbc:mysql://localhost:3306/blockchain_badges
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/blockchain_badges}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# Hibernate cree / met a jour les tables automatiquement (pratique pour un projet academique)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# --- Ethereum (reseau de test Sepolia) ---
# Noeud public gratuit, sans inscription. Pour plus de fiabilite : une URL Infura ou Alchemy dans ETH_RPC_URL.
ethereum.rpc-url=${ETH_RPC_URL:https://ethereum-sepolia-rpc.publicnode.com}
ethereum.private-key=${ETH_PRIVATE_KEY:}
ethereum.contract-address=${CONTRACT_ADDRESS:}
ethereum.chain-id=${CHAIN_ID:11155111}
# --- Authentification ---
# Secret qui signe les jetons (32 caracteres minimum). Vide : un secret aleatoire a chaque demarrage (deconnexion au redemarrage).
auth.jwt-secret=${JWT_SECRET:}
auth.jwt-ttl-minutes=${JWT_TTL_MINUTES:480}
# Compte de l'ecole, cree ou mis a jour au demarrage
auth.ecole-email=${ECOLE_EMAIL:}
auth.ecole-password=${ECOLE_PASSWORD:}
auth.ecole-username=${ECOLE_USERNAME:ecole}

# Badges NFT (facultatif) : adresse du contrat BadgeNFT, obtenue par "mvn compile exec:java -Dexec.args=nft"
ethereum.nft-contract-address=${NFT_CONTRACT_ADDRESS:}

# Adresse publique du site, utilisee dans le QR code des certificats. Vide : deduite de la requete (http://localhost:3000 en local).
app.public-url=${PUBLIC_URL:}
